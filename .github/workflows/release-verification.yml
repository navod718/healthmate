name: Signed APK smoke check
on:
  workflow_dispatch:
  pull_request:
    paths:
      - releases/**
      - scripts/verify-release.sh
      - .github/workflows/release-verification.yml
permissions:
  contents: read
jobs:
  release-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - name: Verify checksum and release signature
        run: |
          sha256sum -c releases/SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs releases/HealthMate-0.1.0-release.apk
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/verify-release.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-release-smoke-evidence
          path: release-evidence/
